plugins {
    id 'com.android.application'
}

android {
    namespace 'id.miftahuljanah.mujamnuzul'
    compileSdk 35

    defaultConfig {
        applicationId "id.miftahuljanah.mujamnuzul"
        minSdk 24
        targetSdk 35
        versionCode 3
        versionName "0.2.1"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
