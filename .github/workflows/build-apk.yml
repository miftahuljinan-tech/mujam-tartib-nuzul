name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Unduh font (SIL OFL) ke assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          d=app/src/main/assets/fonts
          mkdir -p "$d"
          fetch() {
            dir="$1"; out="$2"; pat="$3"
            list=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/google/fonts/contents/ofl/$dir")
            url=$(echo "$list" | jq -r --arg p "$pat" '.[] | select(.name|test($p)) | .download_url' | head -1)
            test -n "$url" || { echo "Font tidak ditemukan: $dir $pat"; echo "$list" | jq -r '.[].name'; exit 1; }
            curl -fsSL "$url" -o "$d/$out"
            lic=$(echo "$list" | jq -r '.[] | select(.name=="OFL.txt") | .download_url')
            curl -fsSL "$lic" -o "$d/OFL-$dir.txt"
            ls -l "$d/$out"
          }
          fetch amiriquran AmiriQuran-Regular.ttf '^AmiriQuran-Regular\.ttf$'
          fetch reemkufi ReemKufi.ttf '\.ttf$'
          fetch montserrat Montserrat.ttf '^Montserrat\[wght\]\.ttf$'
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: mujam-tartib-nuzul-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Build AAB rilis bertanda tangan (kunci unggah Google Play)
        id: aab
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Secret kunci tidak tersedia; AAB rilis dilewati."
            echo "built=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload-key.p12"
          export KEYSTORE_FILE="$RUNNER_TEMP/upload-key.p12"
          # Periksa kunci (hanya menampilkan alias dan sidik jari, bukan rahasia)
          keytool -list -keystore "$KEYSTORE_FILE" -storepass:env KEYSTORE_PASSWORD -alias "$KEY_ALIAS"
          gradle bundleRelease --no-daemon
          rm -f "$KEYSTORE_FILE"
          echo "built=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: steps.aab.outputs.built == 'true'
        with:
          name: mujam-tartib-nuzul-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
